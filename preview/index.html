<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Generated React — LWC migration preview</title>
    <!-- NO SLDS. The CDN stylesheet was removed deliberately: if the page
         still looks right, the CSS conversion is real. If it does not, we
         learn exactly what the converter is missing. Styles come from
         shim/runtime.css plus the generated *.module.css files. -->
    <style>
        body { margin: 0; background: #f3f3f3; font-family: system-ui, -apple-system, Segoe UI, sans-serif; }
        .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
        h1 { font-size: 22px; margin: 0 0 4px; }
        .sub { color: #555; font-size: 14px; margin: 0 0 20px; }
        .warn { background: #fff4e5; border-left: 4px solid #dd7a01; padding: 12px 16px;
                border-radius: 4px; font-size: 14px; margin-bottom: 24px; line-height: 1.5; }
        .warn b { display: block; margin-bottom: 4px; }
        .card { background: #fff; border: 1px solid #dddbda; border-radius: 6px;
                margin-bottom: 20px; overflow: hidden; }
        .head { padding: 12px 16px; border-bottom: 1px solid #eee; display: flex;
                align-items: baseline; gap: 10px; flex-wrap: wrap; }
        .head h2 { font-size: 15px; margin: 0; font-weight: 600; }
        .tag { font-size: 11px; padding: 2px 7px; border-radius: 10px; font-weight: 600; }
        .M { background: #d7f5d3; color: #1a5c12; }
        .A { background: #fff0c2; color: #7a5b00; }
        .H { background: #ffd8d8; color: #8a1c1c; }
        .src { font-size: 12px; margin-left: auto; }
        .body { padding: 16px; }
        .todo { background: #fbfbfb; border-top: 1px solid #eee; padding: 8px 16px;
                font-size: 12px; color: #7a5b00; }
        .err { color: #8a1c1c; font-size: 13px; }
    </style>
</head>

    <div id="root" class="wrap"></div>
    <script type="module" src="./main.jsx"></script>

</html>
