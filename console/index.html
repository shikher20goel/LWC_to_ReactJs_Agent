<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Migration Console — LWC → React / Spring Boot</title>
    <style>
        :root{--bg:#f4f6f9;--panel:#fff;--line:#dfe3e8;--ink:#16325c;--muted:#5e6d82;
              --brand:#0176d3;--ok:#2e844a;--warn:#a86403;--stop:#ba0517;}
        *{box-sizing:border-box}
        body{margin:0;background:var(--bg);color:var(--ink);
             font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;}
        .app{display:grid;grid-template-columns:300px 1fr;height:100vh}
        .side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}
        .side h1{font-size:15px;margin:0;padding:14px 16px;border-bottom:1px solid var(--line)}
        .side h1 small{display:block;font-weight:400;color:var(--muted);font-size:11px;margin-top:2px}
        .filter{padding:10px 12px;border-bottom:1px solid var(--line)}
        .filter input{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:4px;font:inherit}
        .chips{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
        .chip{font-size:11px;padding:3px 8px;border-radius:11px;border:1px solid var(--line);
              background:#fff;cursor:pointer;color:var(--muted)}
        .chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
        .list{overflow:auto;flex:1}
        .item{padding:9px 14px;border-bottom:1px solid #f0f2f5;cursor:pointer;display:flex;
              align-items:center;gap:8px}
        .item:hover{background:#f7f9fc}
        .item.sel{background:#eaf3fc;box-shadow:inset 3px 0 0 var(--brand)}
        .item .nm{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .dot{width:8px;height:8px;border-radius:50%;flex:none}
        .d-clean{background:var(--ok)} .d-review{background:var(--warn)}
        .d-escalated{background:var(--stop)} .d-none{background:#c3cbd6}
        .t{font-size:10px;font-weight:700;padding:1px 5px;border-radius:3px}
        .t-M{background:#d7f5d3;color:#1a5c12}.t-A{background:#fff0c2;color:#7a5b00}
        .t-H{background:#ffd8d8;color:#8a1c1c}
        .main{overflow:auto;padding:20px 24px 60px}
        .hd{display:flex;align-items:center;gap:12px;margin-bottom:4px}
        .hd h2{margin:0;font-size:20px}
        .sub{color:var(--muted);font-size:12px;margin-bottom:16px}
        .btn{background:var(--brand);color:#fff;border:0;padding:8px 16px;border-radius:4px;
             font:600 13px system-ui;cursor:pointer}
        .btn:disabled{background:#9dc4e8;cursor:default}
        .btn.ghost{background:#fff;color:var(--brand);border:1px solid var(--brand)}
        .tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px}
        .tab{padding:8px 14px;cursor:pointer;font-size:13px;color:var(--muted);
             border-bottom:2px solid transparent}
        .tab.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}
        .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
        .card{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
        .card h3{margin:0;padding:10px 14px;font-size:12px;text-transform:uppercase;
                 letter-spacing:.4px;color:var(--muted);border-bottom:1px solid var(--line);
                 background:#fafbfc}
        .card .body{padding:14px}
        .node{display:flex;align-items:center;gap:7px;padding:4px 0;font-size:13px}
        .node .k{font-size:10px;color:#fff;padding:1px 5px;border-radius:3px;flex:none}
        .k-lwc{background:#0176d3}.k-apex{background:#5867e8}.k-base{background:#747474}
        .k-react{background:#087990}.k-spring{background:#3d8b3d}.k-module{background:#a86403}
        .indent{padding-left:18px;border-left:1px dashed var(--line);margin-left:6px}
        .lost{background:#fff5f5;border:1px solid #ffd0d0;border-radius:4px;padding:9px 12px;
              margin-top:8px;font-size:12px}
        .lost b{color:var(--stop)}
        pre{background:#1e1e28;color:#e6e6ef;padding:12px;border-radius:5px;overflow:auto;
            font:12px/1.5 ui-monospace,Consolas,monospace;max-height:520px;margin:0}
        .todo{border-left:3px solid var(--warn);background:#fffbf2;padding:8px 11px;
              margin-bottom:6px;font-size:12px;border-radius:0 4px 4px 0}
        .todo.esc{border-left-color:var(--stop);background:#fff5f5}
        .todo .kd{font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.4px}
        .bar{height:7px;background:#eceff3;border-radius:4px;overflow:hidden;margin:6px 0}
        .bar i{display:block;height:100%;background:var(--ok)}
        .kv{display:flex;justify-content:space-between;padding:4px 0;font-size:13px;
            border-bottom:1px solid #f2f4f7}
        .empty{color:var(--muted);font-style:italic;font-size:13px}
        .banner{background:#fff8e6;border-left:4px solid var(--warn);padding:11px 14px;
                border-radius:0 5px 5px 0;margin-bottom:18px;font-size:13px;line-height:1.55}
    </style>
</head>
<body>
    <div id="root" class="app"></div>
    <script type="module" src="./main.jsx"></script>
</body>
</html>
