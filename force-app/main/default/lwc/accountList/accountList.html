<template>
    <lightning-card title="Accounts" icon-name="standard:account">
        <template lwc:if={hasAccounts}>
            <ul class="slds-has-dividers_bottom-space">
                <template for:each={accounts} for:item="account">
                    <li key={account.Id} class="account-row slds-item">
                        <p class="account-name">{account.Name}</p>
                        <lightning-formatted-text
                            value={account.Industry}></lightning-formatted-text>
                        <lightning-button label="View" variant="neutral"
                            data-id={account.Id} onclick={handleView}></lightning-button>
                    </li>
                </template>
            </ul>
        </template>
        <template lwc:elseif={hasError}>
            <p class="error-state">Unable to load accounts</p>
        </template>
        <template lwc:else>
            <p class="empty-state">No accounts to display</p>
        </template>
    </lightning-card>
</template>
